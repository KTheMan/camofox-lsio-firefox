server {
  listen 3000 default_server;
  listen [::]:3000 default_server;

  # The client reaches this server via an SSH forward on its own loopback.
  if ($http_host !~ "^(localhost|127\.0\.0\.1)(:[0-9]+)?$") { return 403; }

  # Newer Selkies dashboards read their mode and connection status here.
  location = SUBFOLDERapi/status {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:CWS;
  }

  location SUBFOLDER {
    alias /usr/share/selkies/web/;
    index index.html;
    try_files $uri $uri/ =404;
  }

  # Keep both Selkies stream URLs available without routing the rest of /api.
  location ~ ^SUBFOLDER(?:websockets?|api/websockets)/?$ {
    # Require the browser to have loaded the desktop from this same local origin.
    if ($http_origin != "http://$http_host") { return 403; }
    proxy_pass http://127.0.0.1:CWS;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}

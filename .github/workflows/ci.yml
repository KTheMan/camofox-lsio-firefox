name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: bash scripts/build-image.sh -t camofox-lsio-firefox:ci
      - name: Verify browser automation and the Selkies stream
        run: bash scripts/smoke-image.sh camofox-lsio-firefox:ci

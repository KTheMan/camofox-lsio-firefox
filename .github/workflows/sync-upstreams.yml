name: sync-upstreams

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      USING_REPO_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream: selkies
            pin: pins/selkies-image
          - upstream: camofox
            pin: pins/camofox-ref
    concurrency:
      group: sync-upstream-${{ matrix.upstream }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve one upstream
        env:
          UPSTREAM: ${{ matrix.upstream }}
        run: bash scripts/update-upstream.sh "$UPSTREAM"
      - name: Open or update upstream PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          add-paths: ${{ matrix.pin }}
          commit-message: 'build: update ${{ matrix.upstream }} pin'
          title: 'build: update ${{ matrix.upstream }} pin'
          body: |
            Refreshes `${{ matrix.pin }}` from the published upstream.
            The candidate runs the overlay build and headed browser smoke check before publishing.
          branch: automation/update-${{ matrix.upstream }}
          delete-branch: true
      - name: Start CI on the candidate
        if: env.USING_REPO_TOKEN == 'true' && (steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_BRANCH: automation/update-${{ matrix.upstream }}
        run: gh workflow run ci.yml --ref "$UPSTREAM_BRANCH"

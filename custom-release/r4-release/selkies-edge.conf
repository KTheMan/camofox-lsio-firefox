map $http_upgrade $selkies_connection {
  default upgrade;
  '' close;
}

map $http_upgrade $selkies_origin {
  default http://127.0.0.1:3000;
  '' '';
}

# Rewrite Origin only after verifying the browser's original public Origin.
map "$http_upgrade|$http_origin" $selkies_bad_origin {
  default 1;
  ~^\| 0;
  ~*^websocket\|https://camofox\.example\.invalid$ 0;
}

server {
  listen 8080 default_server;
  server_name camofox.example.invalid;
  server_tokens off;
  # Verify signature, issuer, audience and expiry for HTTP and WebSocket.
  # The verifier listener is private and is not published on the host.
  if ($http_host != camofox.example.invalid) { return 403; }
  if ($http_cf_access_jwt_assertion = '') { return 403; }
  if ($selkies_bad_origin) { return 403; }
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  add_header Cache-Control 'private, no-store' always;
  add_header X-Frame-Options DENY always;

  location = /__access_check {
    internal;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $verifier http://camofox-r2-candidate:9380;
    proxy_pass $verifier/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    proxy_connect_timeout 3s;
    proxy_read_timeout 7s;
  }

  location / {
    auth_request /__access_check;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $desktop http://camofox-r2-candidate:3000;
    proxy_pass $desktop$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:3000;
    proxy_set_header Origin $selkies_origin;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $selkies_connection;
    proxy_set_header Authorization '';
    proxy_set_header Cookie '';
    proxy_set_header Cf-Access-Jwt-Assertion '';
    proxy_set_header Cf-Access-Authenticated-User-Email '';
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
